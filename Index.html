<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.M Vídeos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #181818;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.topo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #ff0000;
}

.pesquisa {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 20px;
    outline: none;
}

.menu {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 15px;
}

.menu button {
    white-space: nowrap;
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
    background: #292929;
    color: white;
}

.menu button:hover {
    background: #ff0000;
}

main {
    padding: 15px;
}

h2 {
    margin-top: 10px;
}

.videos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
}

.video {
    background: #1c1c1c;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
}

.video img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.video-info {
    padding: 12px;
}

.video-info h3 {
    margin: 0 0 8px;
    font-size: 17px;
}

.video-info p {
    margin: 0;
    color: #999;
    font-size: 14px;
}

.publicar {
    margin-top: 30px;
    background: #181818;
    padding: 20px;
    border-radius: 12px;
}

.publicar input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
}

.publicar button {
    width: 100%;
    padding: 13px;
    background: #e60000;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

#player {
    width: 100%;
    margin-top: 15px;
    border-radius: 10px;
    display: none;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>

    <div class="topo">

        <div class="logo">J.M</div>

        <input
            class="pesquisa"
            id="pesquisa"
            type="text"
            placeholder="Pesquisar vídeos..."
            onkeyup="pesquisar()"
        >

    </div>

    <div class="menu">
        <button>🏠 Início</button>
        <button>🔥 Mais vistos</button>
        <button>🎮 Jogos</button>
        <button>🎵 Música</button>
        <button>😂 Humor</button>
    </div>

</header>

<main>

<h2>🔥 Vídeos recentes</h2>

<div class="videos" id="listaVideos">

    <div class="video" data-titulo="Meu primeiro vídeo">

        <img src="https://picsum.photos/600/350?random=10">

        <div class="video-info">
            <h3>Meu primeiro vídeo</h3>
            <p>J.M • 1,2 mil visualizações</p>
        </div>

    </div>


    <div class="video" data-titulo="Vídeo de jogos">

        <img src="https://picsum.photos/600/350?random=20">

        <div class="video-info">
            <h3>Vídeo de jogos</h3>
            <p>J.M • 850 visualizações</p>
        </div>

    </div>


    <div class="video" data-titulo="Melhores momentos">

        <img src="https://picsum.photos/600/350?random=30">

        <div class="video-info">
            <h3>Melhores momentos</h3>
            <p>J.M • 2,4 mil visualizações</p>
        </div>

    </div>


    <div class="video" data-titulo="Novo vídeo">

        <img src="https://picsum.photos/600/350?random=40">

        <div class="video-info">
            <h3>Novo vídeo</h3>
            <p>J.M • 500 visualizações</p>
        </div>

    </div>

</div>


<div class="publicar">

<h2>📤 Publicar vídeo</h2>

<input
    type="text"
    id="titulo"
    placeholder="Título do vídeo"
>

<input
    type="file"
    id="videoInput"
    accept="video/*"
>

<button onclick="publicarVideo()">
    Publicar vídeo
</button>

<video id="player" controls></video>

</div>

</main>

<footer>

© 2026 J.M Vídeos

</footer>


<script>

function pesquisar() {

    let texto =
        document.getElementById("pesquisa").value.toLowerCase();

    let videos =
        document.querySelectorAll(".video");

    videos.forEach(function(video) {

        let titulo =
            video.dataset.titulo.toLowerCase();

        if (titulo.includes(texto)) {
            video.style.display = "block";
        } else {
            video.style.display = "none";
        }

    });

}


function publicarVideo() {

    let arquivo =
        document.getElementById("videoInput").files[0];

    if (!arquivo) {

        alert("Escolha um vídeo primeiro!");

        return;
    }

    let url =
        URL.createObjectURL(arquivo);

    let player =
        document.getElementById("player");

    player.src = url;

    player.style.display = "block";

    player.play();

}

</script>

</body>
</html>
